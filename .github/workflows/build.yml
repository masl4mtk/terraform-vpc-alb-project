name: Build infrastructure


on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/*
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  check_format:

    name: Check Terraform files are formatted correctly  
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: terraform fmt
        run: terraform fmt -check -recursive
        id: terraform-fmt
      
      - name: Wrong formatting found
        if: ${{ failure() && steps.terraform-fmt.outputs.failure_reason == 'check-failed' }}
        run: echo "Formatting Check Failed."

      
  initialise_and_validate:

    needs: check_format
    name: Initialise and validate Terraform files
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show OIDC claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c "import sys,json,base64; p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4); d=json.loads(base64.urlsafe_b64decode(p)); print({k:d[k] for k in ('sub','aud','iss')})" "$TOKEN"

      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::386346184027:role/github-actions-terraform
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: terraform init
        run: terraform init

      - name: terraform validate
        run: terraform validate


