name: Build infrastructure


on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/**
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  check_format:

    name: Check Terraform files are formatted correctly  
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: terraform fmt
        run: terraform fmt -check -recursive
        id: terraform-fmt
      
      - name: Wrong formatting found
        if: ${{ failure() && steps.terraform-fmt.outputs.failure_reason == 'check-failed' }}
        run: echo "Formatting Check Failed."

      
  initialise_and_validate:

    needs: check_format
    name: Initialise and validate Terraform files
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN}}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: terraform init
        run: terraform init

      - name: terraform validate
        run: terraform validate

  linting:

    needs: initialise_and_validate
    name: Linting Terraform files
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check linting of Terraform files
        uses: devops-infra/action-tflint@v1.0.5


  security_scanning:

    needs: linting
    name: Security scanning Terraform files
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Security scanning of Terraform files
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          additional_args: --soft-fail

  terraform_plan:

    needs: security_scanning
    name: Terraform plan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN}}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: terraform init
        run: terraform init

      - name: terraform plan
        run: terraform plan -out=tfplan -input=false