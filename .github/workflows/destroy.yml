name: Destroy infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type yes to confirm destruction of all Terraform-managed infrastructure"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read
  id-token: write

jobs:
  confirmation_check:
    name: Confirmation check
    runs-on: ubuntu-latest
    steps:
      - name: Confirm destruction
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
        run: |
          if [ "$CONFIRM_DESTROY" != "yes" ]; then
            echo "Destruction cancelled. Select 'yes' to continue."
            exit 1
          fi

  destroy_plan:
    name: Destroy plan
    needs: confirmation_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform init
        run: terraform init

      - name: Create destroy plan
        run: terraform plan -destroy -out=tfplan

      - name: Upload destroy plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-destroy-plan
          path: tfplan
          retention-days: 1

  manual_approval:
    name: Manual approval
    needs: destroy_plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Approval granted
        run: echo "Production environment approval granted."

  terraform_destroy:
    name: Terraform destroy
    needs: manual_approval
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform init
        run: terraform init

      - name: Download destroy plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-destroy-plan

      - name: Apply destroy plan
        run: terraform apply -auto-approve tfplan